<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#333}canvas{display:block}</style>

<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;
const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setSize(W, H);

document.body.appendChild(renderer.domElement);

const css = c => `rgb(${c.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255)).join(',')})`;
function rng(seed) { let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// Stand-ins for what each operator's viewer would show inside TD.
function viewerCanvas(node, kind, rectW, rectH, label, bg) {
  const cw = Math.max(32, Math.round(rectW * 200)), ch = Math.max(16, Math.round(rectH * 200));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d'); const r = rng(node.name + node.path);
  if (kind === 'textTOP') {
    g.fillStyle = css(bg); g.fillRect(0, 0, cw, ch);
    g.fillStyle = 'rgb(153,153,153)'; g.font = `${Math.round(ch * 0.28)}px sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, cw / 2, ch / 2); return c;
  }
  g.fillStyle = '#111'; g.fillRect(0, 0, cw, ch);
  const f = node.family, n = node.name;
  if (f === 'TOP') {
    // Fit TOP: 16:9 image letterboxed in the viewer area
    let iw = cw, ih = cw * 9 / 16; if (ih > ch) { ih = ch; iw = ch * 16 / 9; }
    const ox = (cw - iw) / 2, oy = (ch - ih) / 2;
    g.save(); g.beginPath(); g.rect(ox, oy, iw, ih); g.clip();
    if (/noise/.test(n)) {
      for (let y = 0; y < ih; y += 3) for (let x = 0; x < iw; x += 3) {
        const v = 0.5 + 0.5 * Math.sin(x * 0.05 + Math.sin(y * 0.07) * 3) * Math.cos(y * 0.04 + x * 0.01);
        g.fillStyle = css([v, v, v]); g.fillRect(ox + x, oy + y, 3, 3); }
    } else if (/threshold/.test(n)) {
      g.fillStyle = '#000'; g.fillRect(ox, oy, iw, ih); g.fillStyle = '#fff';
      for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(ox + iw * r(), oy + ih * r(), ih * (0.08 + 0.12 * r()), 0, 7); g.fill(); }
    } else if (/edge/.test(n)) {
      g.fillStyle = '#000'; g.fillRect(ox, oy, iw, ih); g.strokeStyle = '#ddd'; g.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(ox + iw * r(), oy + ih * r(), ih * (0.1 + 0.3 * r()), 0, 7); g.stroke(); }
    } else {
      const grad = g.createLinearGradient(ox, oy, ox, oy + ih);
      grad.addColorStop(0, '#1d3b6e'); grad.addColorStop(0.55, '#e0703a'); grad.addColorStop(1, '#2a1a2e');
      g.fillStyle = grad; g.fillRect(ox, oy, iw, ih);
      g.fillStyle = 'rgba(255,220,150,0.9)'; g.beginPath(); g.arc(ox + iw * 0.6, oy + ih * 0.52, ih * 0.13, 0, 7); g.fill();
      g.fillStyle = '#140d18'; g.beginPath(); g.moveTo(ox, oy + ih);
      for (let x = 0; x <= iw; x += iw / 12) g.lineTo(ox + x, oy + ih * (0.62 + 0.15 * r())); g.lineTo(ox + iw, oy + ih); g.fill();
      if (/blur/.test(n)) { g.filter = 'blur(4px)'; g.drawImage(c, 0, 0); g.filter = 'none'; }
      if (/level|comp|add|null|feedback|out|in/.test(n)) {
        g.fillStyle = `rgba(${Math.round(255 * r())},${Math.round(120 * r())},255,0.18)`; g.fillRect(ox, oy, iw, ih); }
    }
    g.restore(); return c;
  }
  if (f === 'CHOP') {
    g.strokeStyle = '#333'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, ch / 2); g.lineTo(cw, ch / 2); g.stroke();
    const cols = ['#e05050', '#50c050', '#5080ff'];
    for (let k = 0; k < (n === 'lfo1' ? 1 : 2); k++) {
      g.strokeStyle = cols[k]; g.lineWidth = 2; g.beginPath();
      for (let x = 0; x <= cw; x += 2) {
        const t = x / cw * Math.PI * 4 + k;
        let v = Math.sin(t); if (/math/.test(n)) v = Math.abs(v) * 2 - 1; if (/filter|null/.test(n)) v = Math.sin(t) * 0.7 + Math.sin(t * 3) * 0.1;
        g.lineTo(x, ch / 2 - v * ch * 0.38); }
      g.stroke(); }
    return c;
  }
  if (f === 'SOP') {
    g.strokeStyle = '#ddd'; g.lineWidth = 1.2;
    const rot = /transform/.test(n) ? 0.6 : 0.35, s = ch * 0.28, cx = cw / 2, cy = ch / 2;
    const P = []; for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) {
      const X = x * Math.cos(rot) - z * Math.sin(rot), Z = x * Math.sin(rot) + z * Math.cos(rot);
      const Y = y * Math.cos(0.4) - Z * Math.sin(0.4); P.push([cx + X * s, cy - Y * s]); }
    for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++) if ([1, 2, 4].includes(a ^ b)) {
      g.beginPath(); g.moveTo(...P[a]); g.lineTo(...P[b]); g.stroke(); }
    return c;
  }
  if (f === 'DAT') {
    g.fillStyle = '#1a1a1a'; g.fillRect(0, 0, cw, ch);
    g.font = `${Math.round(ch * 0.13)}px monospace`; g.fillStyle = '#ccc'; g.textBaseline = 'top';
    const rows = [['name', 'value'], ['speed', '0.5'], ['gain', '1.2'], ['mode', 'add'], ['seed', '7']];
    rows.forEach((row, i) => { g.fillText(row[0], 6, 4 + i * ch * 0.18); g.fillText(row[1], cw * 0.55, 4 + i * ch * 0.18); });
    return c;
  }
  if (f === 'MAT') {
    const grad = g.createRadialGradient(cw * 0.45, ch * 0.4, 2, cw / 2, ch / 2, ch * 0.4);
    grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#666'); g.fillStyle = grad;
    g.beginPath(); g.arc(cw / 2, ch / 2, ch * 0.38, 0, 7); g.fill(); return c;
  }
  g.fillStyle = '#1c1c1c'; g.fillRect(0, 0, cw, ch);   // COMP: Base COMP has no panel
  return c;
}

function stripCanvas(text, bg, rectW, rectH, panel) {
  const scale = panel ? 60 : 300;
  const cw = Math.max(32, Math.round(rectW * scale)), ch = Math.max(8, Math.round(rectH * scale));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch; const g = c.getContext('2d');
  g.fillStyle = css(bg); g.fillRect(0, 0, cw, ch);
  g.fillStyle = 'rgb(230,230,230)';
  if (panel) {
    // word-wrapped, like the Text TOP with Word Wrap on; first paragraph is the title
    const fs = Math.round(cw * 0.021); g.font = `${fs}px sans-serif`; g.textBaseline = 'top';
    let y = 8;
    for (const para of String(text || '').split('\n')) {
      let line = '';
      for (const word of para.split(' ')) {
        const t = line ? line + ' ' + word : word;
        if (g.measureText(t).width > cw - 20 && line) { g.fillText(line, 10, y); y += fs * 1.25; line = word; }
        else line = t;
      }
      g.fillText(line, 10, y); y += fs * 1.25;
    }
  }
  else { g.font = `${Math.round(ch * 0.62)}px sans-serif`; g.textBaseline = 'middle'; g.fillText(text, ch * 0.18, ch * 0.54); }
  return c;
}

function mat(color, alpha, map) {
  const m = new THREE.MeshBasicMaterial({color: new THREE.Color(...color), transparent: alpha < 0.999,
    opacity: alpha, depthWrite: alpha >= 0.999, side: THREE.DoubleSide});
  if (map) { m.map = new THREE.CanvasTexture(map); m.map.anisotropy = 8; }
  return m;
}

function build(shot) {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(...shot.bg);
  const box = new THREE.BoxGeometry(1, 1, 1), plane = new THREE.PlaneGeometry(1, 1);
  const boxes = (ch) => { const n = (ch.tx || []).length; for (let i = 0; i < n; i++) {
      if (ch.sx[i] < 1e-3) continue;
      const m = new THREE.Mesh(box, mat([ch.r[i], ch.g[i], ch.b[i]], ch.a[i]));
      m.position.set(ch.tx[i], ch.ty[i], ch.tz[i]); m.scale.set(ch.sx[i], ch.sy[i], ch.sz[i]); scene.add(m); } };
  boxes(shot.inst); boxes(shot.conn); boxes(shot.flags);
  // wires grouped by alpha
  const byAlpha = {};
  for (const q of shot.wires) { const k = q.c[3].toFixed(3); (byAlpha[k] = byAlpha[k] || []).push(q); }
  for (const [a, qs] of Object.entries(byAlpha)) {
    const pos = [], col = [];
    for (const q of qs) for (const i of [0, 1, 2, 0, 2, 3]) { pos.push(...q.p[i]); col.push(q.c[0], q.c[1], q.c[2]); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const m = new THREE.MeshBasicMaterial({vertexColors: true, transparent: +a < 0.999, opacity: +a, depthWrite: +a >= 0.999, side: THREE.DoubleSide});
    scene.add(new THREE.Mesh(geo, m));
  }
  for (const card of shot.cards) {
    const src = shot[card.src], i = card.idx;
    if (src.sc[i] < 1e-3) continue;
    const grp = new THREE.Group(); grp.position.set(src.tx[i], src.ty[i], src.fz[i]); grp.scale.setScalar(src.sc[i]);
    const alpha = src.ca[i], panel = card.src === 'notes', node = panel ? null : shot.nodes[i];
    for (const [part, d] of Object.entries(card.parts)) {
      const [x, y, w, h] = d.rect;
      const canvas = part === 'view' ? viewerCanvas(node, d.kind, w, h, d.text, d.bg) : stripCanvas(d.text, d.bg, w, h, panel);
      const m = new THREE.Mesh(plane, mat([d.dim, d.dim, d.dim], alpha, canvas));
      m.position.set(x, y, panel ? 0 : 0.0005); m.scale.set(w, h, 1);
      grp.add(m);
    }
    scene.add(grp);
  }
  return scene;
}

window.render = (shot, camPos, look, fov) => {
  const scene = build(shot);
  const cam = new THREE.PerspectiveCamera(fov || 45, W / H, 0.01, 200);
  cam.position.set(...camPos); cam.lookAt(new THREE.Vector3(...look));
  renderer.render(scene, cam);
  return true;
};
window.ready = true;
</script></body></html>
